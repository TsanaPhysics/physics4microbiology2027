<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%" style="background:#090d16; font-family:'Prompt',system-ui,sans-serif;">
  <defs>
    <filter id="glowDropKg" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="920" height="460" fill="#090d16"/>

  <!-- Title -->
  <text x="460" y="38" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">วิวัฒนาการนิยาม "มวล 1 กิโลกรัม (1 Kilogram)" จากอดีตสู่ปัจจุบัน</text>
  <text x="460" y="60" text-anchor="middle" fill="#94a3b8" font-size="12">จากน้ำบริสุทธิ์ 1 ลิตร สู่ก้อนโลหะ Le Grand K จนถึงเครื่องชั่งคิบบิลที่ตรึงค่าคงตัวของพลังค์ (h)</text>

  <!-- Timeline Axis -->
  <line x1="100" y1="180" x2="820" y2="180" stroke="#334155" stroke-width="4"/>
  <circle cx="180" cy="180" r="10" fill="#38bdf8"/>
  <circle cx="460" cy="180" r="10" fill="#fbbf24"/>
  <circle cx="740" cy="180" r="12" fill="#34d399" stroke="#059669" stroke-width="3"/>

  <!-- Stage 1: 1795 (Grave / 1 Liter of Water at Melting/4°C) -->
  <g transform="translate(180, 0)" filter="url(#glowDropKg)">
    <rect x="-45" y="115" width="90" height="26" rx="13" fill="#0284c7"/>
    <text y="132" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700" font-family="'JetBrains Mono',monospace">ค.ศ. 1795</text>

    <rect x="-105" y="215" width="210" height="215" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text y="240" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">1. มวลน้ำบริสุทธิ์ 1 ลิตร</text>
    <text y="258" text-anchor="middle" fill="#64748b" font-size="10" font-family="'JetBrains Mono',monospace">(1 dm³ of Water at 4°C)</text>

    <!-- Visual Icon (Flask with 1L water) -->
    <g transform="translate(0, 300)">
      <path d="M -18 -22 L 18 -22 L 18 -10 L 26 18 C 28 24 22 28 16 28 L -16 28 C -22 28 -28 24 -26 18 L -18 -10 Z" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
      <ellipse cx="0" cy="5" rx="20" ry="6" fill="#38bdf8" opacity="0.6"/>
      <text y="10" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">1 L (4°C)</text>
    </g>

    <text y="350" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="500">มวลของน้ำบริสุทธิ์ 1 ลิตร</text>
    <text y="368" text-anchor="middle" fill="#94a3b8" font-size="10">($1\text{ dm}^3 = 1{,}000\text{ cm}^3$)</text>
    <text y="386" text-anchor="middle" fill="#94a3b8" font-size="10">ที่อุณหภูมิจุดเยือกแข็ง / 4 °C</text>
    <text y="404" text-anchor="middle" fill="#f87171" font-size="9">⚠️ ขึ้นกับความดันและไอโซโทปน้ำ</text>
  </g>

  <!-- Stage 2: 1889 - 2019 (IPK: Le Grand K) -->
  <g transform="translate(460, 0)" filter="url(#glowDropKg)">
    <rect x="-65" y="115" width="130" height="26" rx="13" fill="#d97706"/>
    <text y="132" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700" font-family="'JetBrains Mono',monospace">ค.ศ. 1889–2019</text>

    <rect x="-115" y="215" width="230" height="215" rx="14" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
    <text y="240" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700">2. กิโลกรัมต้นแบบนานาชาติ</text>
    <text y="258" text-anchor="middle" fill="#64748b" font-size="10" font-family="'JetBrains Mono',monospace">(Le Grand K — IPK)</text>

    <!-- Visual Icon (Cylinder under double bell jars) -->
    <g transform="translate(0, 298)">
      <!-- Outer Bell Jar -->
      <path d="M -30 25 C -30 -15 -20 -28 0 -28 C 20 -28 30 -15 30 25 Z" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,2"/>
      <!-- Inner Bell Jar -->
      <path d="M -22 25 C -22 -8 -15 -20 0 -20 C 15 -20 22 -8 22 25 Z" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Pt-Ir Cylinder -->
      <rect x="-14" y="2" width="28" height="22" rx="2" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
      <ellipse cx="0" cy="2" rx="14" ry="4" fill="#fef08a"/>
      <!-- Base plate -->
      <rect x="-35" y="24" width="70" height="4" fill="#475569"/>
    </g>

    <text y="348" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="500">ทรงกระบอกโลหะ Pt 90% + Ir 10%</text>
    <text y="366" text-anchor="middle" fill="#94a3b8" font-size="10">เก็บในครอบแก้วสุญญากาศ 3 ชั้น</text>
    <text y="384" text-anchor="middle" fill="#94a3b8" font-size="10">ณ BIPM เมืองเซฟวร์ ชานกรุงปารีส</text>
    <text y="402" text-anchor="middle" fill="#f87171" font-size="9">⚠️ มวลเปลี่ยนไป ~50 µg ในรอบ 100 ปี</text>
  </g>

  <!-- Stage 3: 2019 - Present (Kibble Balance / Planck Constant h) -->
  <g transform="translate(740, 0)" filter="url(#glowDropKg)">
    <rect x="-65" y="115" width="130" height="26" rx="13" fill="#059669"/>
    <text y="132" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700" font-family="'JetBrains Mono',monospace">20 พ.ค. 2019–ปัจจุบัน</text>

    <rect x="-115" y="215" width="230" height="215" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="2.5"/>
    <text y="240" text-anchor="middle" fill="#34d399" font-size="13" font-weight="800">3. เครื่องชั่งคิบบิล &amp; ค่าคงตัว h</text>
    <text y="258" text-anchor="middle" fill="#a7f3d0" font-size="10" font-family="'JetBrains Mono',monospace">h = 6.626 070 15 × 10⁻³⁴ J·s</text>

    <!-- Visual Icon (Kibble Balance coil in magnetic field) -->
    <g transform="translate(0, 298)">
      <!-- Magnet poles N and S -->
      <rect x="-30" y="-18" width="16" height="38" rx="2" fill="#ef4444"/>
      <text x="-22" y="5" text-anchor="middle" fill="#fff" font-size="10" font-weight="800">N</text>
      <rect x="14" y="-18" width="16" height="38" rx="2" fill="#3b82f6"/>
      <text x="22" y="5" text-anchor="middle" fill="#fff" font-size="10" font-weight="800">S</text>
      <!-- Magnetic field lines -->
      <line x1="-14" y1="-8" x2="14" y2="-8" stroke="#facc15" stroke-width="1.5" stroke-dasharray="2,2"/>
      <line x1="-14" y1="5" x2="14" y2="5" stroke="#facc15" stroke-width="1.5" stroke-dasharray="2,2"/>
      <line x1="-14" y1="18" x2="14" y2="18" stroke="#facc15" stroke-width="1.5" stroke-dasharray="2,2"/>
      <!-- Balance wire & Pan -->
      <line x1="0" y1="-26" x2="0" y2="10" stroke="#cbd5e1" stroke-width="2"/>
      <ellipse cx="0" cy="10" rx="10" ry="3" fill="#34d399"/>
      <text y="-28" text-anchor="middle" fill="#34d399" font-size="9" font-weight="700">mg = I·L·B</text>
    </g>

    <text y="348" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">เปรียบเทียบพลังงานกลกับไฟฟ้า</text>
    <text y="366" text-anchor="middle" fill="#a7f3d0" font-size="10">ผ่านปรากฏการณ์ควอนตัมฮอลล์</text>
    <text y="384" text-anchor="middle" fill="#fef08a" font-size="11" font-weight="700">ตรึงค่าคงตัวของพลังค์ (h)</text>
    <text y="402" text-anchor="middle" fill="#6ee7b7" font-size="9">✓ นิยามมวลสามารถสร้างซ้ำได้ในทุกห้องแล็บ</text>
  </g>
</svg>
