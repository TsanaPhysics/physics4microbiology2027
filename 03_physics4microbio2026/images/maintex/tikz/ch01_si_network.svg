  <line x1="380.25" y1="768.67" x2="359.42" y2="811.91" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>
  <circle cx="380.25" cy="768.67" r="3.5" fill="#2563eb"/>

