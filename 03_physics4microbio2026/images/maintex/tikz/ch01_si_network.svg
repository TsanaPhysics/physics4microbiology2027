        <path d="M -16 -18 A 16 16 0 0 1 16 -18" fill="none" stroke="#ef4444" stroke-width="2"/>
        <line x1="0" y1="-18" x2="4" y2="-26" stroke="#ffffff" stroke-width="2"/>
        <!-- Footprints -->
