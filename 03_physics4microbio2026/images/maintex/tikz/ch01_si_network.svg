        <text y="64" text-anchor="middle" fill="#bbf7d0" font-size="10" font-weight="700">เวลา &bull; Time</text>
      </g>
    
  <line x1="619.75" y1="768.67" x2="640.58" y2="811.91" stroke="#eab308" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>
