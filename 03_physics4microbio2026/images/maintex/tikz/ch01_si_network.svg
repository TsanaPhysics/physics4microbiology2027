<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%" style="background:#090d16; font-family:'Prompt',system-ui,-apple-system,sans-serif;">
  <defs>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Background Glow -->
  <rect width="1000" height="1000" fill="#080c18"/>
  <circle cx="500" cy="520" r="380" fill="url(#centerGlow)"/>

  <!-- Top Title Header -->
  <g transform="translate(500, 60)">
    <text text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="3" font-family="'JetBrains Mono', monospace">INTERNATIONAL SYSTEM OF UNITS (BIPM 2019)</text>
    <text y="32" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="800" letter-spacing="1">SI Base Units &bull; 7 หน่วยฐานสากล</text>
    <text y="56" text-anchor="middle" fill="#94a3b8" font-size="14">รากฐานการวัดทางฟิสิกส์สำหรับการสอบเทียบและการทดลองในห้องปฏิบัติการจุลชีววิทยา</text>
  </g>

<circle cx="500" cy="520" r="350" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
