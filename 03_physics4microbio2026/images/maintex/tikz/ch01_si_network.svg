  </g>
  <g transform="rotate(257.14285714285717, 500, 520) translate(500, 370)">
    <text transform="rotate(180)" text-anchor="middle" dominant-baseline="central" fill="#86198f" font-size="13" font-weight="800" font-family="'Outfit','Prompt',sans-serif">mole</text>
  </g>
  <g transform="rotate(308.57142857142856, 500, 520) translate(500, 292)">
    <text transform="rotate(0)" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="28" font-weight="900" font-family="'Outfit','Prompt',sans-serif" filter="url(#cardShadow)">cd</text>
  </g>
  <g transform="rotate(308.57142857142856, 500, 520) translate(500, 370)">
    <text transform="rotate(0)" text-anchor="middle" dominant-baseline="central" fill="#9a3412" font-size="13" font-weight="800" font-family="'Outfit','Prompt',sans-serif">candela</text>
  </g>
  <!-- Center Hub -->
