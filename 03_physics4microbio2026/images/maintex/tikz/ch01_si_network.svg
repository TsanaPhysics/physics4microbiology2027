  <path d="M 320.00 477.26 A 185 185 0 0 1 418.28 354.03 L 449.20 416.83 A 115 115 0 0 0 388.11 493.43 Z" fill="#fed7aa"/>
  <g transform="rotate(0.0, 500, 520) translate(500, 292)">
    <text transform="rotate(0)" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="28" font-weight="900" font-family="'Outfit','Prompt',sans-serif" filter="url(#cardShadow)">kg</text>
  </g>
  <g transform="rotate(0.0, 500, 520) translate(500, 370)">
