  <!-- Bottom Metrology Summary Panel -->
  <g transform="translate(100, 890)">
    <rect width="800" height="70" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" filter="url(#cardShadow)"/>
    <g transform="translate(25, 26)">
      <circle cx="8" cy="8" r="14" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="8" y="12" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="800">i</text>
      <text x="32" y="6" fill="#f8fafc" font-size="13" font-weight="700">ระบบหน่วยเอสไอฉบับปรับปรุงใหม่ (The Revised SI — 2019 by BIPM/CGPM)</text>
      <text x="32" y="24" fill="#94a3b8" font-size="11">กำหนดนิยาม 7 หน่วยฐานสากลผ่านค่าคงที่พื้นฐานของธรรมชาติอย่างสมบูรณ์ ปราศจากการเสื่อมสลายของวัตถุประดิษฐ์</text>
    </g>
  </g>
</svg>