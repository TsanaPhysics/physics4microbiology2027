        <line x1="-16" y1="-10" x2="-22" y2="8" stroke="#e879f9" stroke-width="3"/>
        <!-- Atom spheres -->
        <circle cx="0" cy="2" r="8" fill="#d946ef" stroke="#ffffff" stroke-width="1.5"/>
        <circle cx="-16" cy="-10" r="7" fill="#c026d3" stroke="#ffffff" stroke-width="1.5"/>
        <circle cx="18" cy="-8" r="7" fill="#c026d3" stroke="#ffffff" stroke-width="1.5"/>
        <circle cx="-6" cy="18" r="6" fill="#f472b6" stroke="#ffffff" stroke-width="1.5"/>
        <circle cx="16" cy="14" r="6" fill="#f472b6" stroke="#ffffff" stroke-width="1.5"/>
        <circle cx="-22" cy="8" r="5" fill="#f472b6" stroke="#ffffff" stroke-width="1.5"/>
        <!-- Badge label -->
