    <text y="-32" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.5">REVISED SI 2019</text>
    <text y="-8" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="800">SI BASE</text>
    <text y="14" text-anchor="middle" fill="#38bdf8" font-size="18" font-weight="800">UNITS</text>
    <text y="36" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">7 หน่วยฐานสากล</text>
  </g>

  <line x1="500.00" y1="244.00" x2="500.00" y2="196.00" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>
  <circle cx="500.00" cy="244.00" r="3.5" fill="#ef4444"/>

      <!-- Weighing Scale with footprints -->
