        <text y="64" text-anchor="middle" fill="#bfdbfe" font-size="10" font-weight="700">อุณหภูมิ &bull; Temp</text>
      </g>
    
  <line x1="230.92" y1="581.42" x2="184.12" y2="592.10" stroke="#d946ef" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>
  <circle cx="230.92" cy="581.42" r="3.5" fill="#d946ef"/>

      <!-- Molecular Structure -->
      <g transform="translate(139.28, 602.33)">
        <rect x="-42" y="-42" width="84" height="84" rx="20" fill="#1e293b" stroke="#d946ef" stroke-width="2.5" filter="url(#cardShadow)"/>
        <!-- Chemical bonds -->
        <line x1="-16" y1="-10" x2="0" y2="2" stroke="#e879f9" stroke-width="3"/>
        <line x1="0" y1="2" x2="18" y2="-8" stroke="#e879f9" stroke-width="3"/>
