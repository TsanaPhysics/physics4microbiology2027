        <text y="64" text-anchor="middle" fill="#f5d0fe" font-size="10" font-weight="700">ปริมาณสาร &bull; Mole</text>
      </g>
    
  <line x1="284.21" y1="347.92" x2="246.69" y2="317.99" stroke="#f97316" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>
  <circle cx="284.21" cy="347.92" r="3.5" fill="#f97316"/>

      <!-- Light Bulb / Illumination -->
      <g transform="translate(210.72, 289.31)">
        <rect x="-42" y="-42" width="84" height="84" rx="20" fill="#1e293b" stroke="#f97316" stroke-width="2.5" filter="url(#cardShadow)"/>
        <!-- Light rays -->
        <line x1="-24" y1="-22" x2="-30" y2="-28" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
        <line x1="0" y1="-30" x2="0" y2="-38" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
        <line x1="24" y1="-22" x2="30" y2="-28" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
        <line x1="-32" y1="-2" x2="-40" y2="-2" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
        <line x1="32" y1="-2" x2="40" y2="-2" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
        <!-- Glass bulb -->
