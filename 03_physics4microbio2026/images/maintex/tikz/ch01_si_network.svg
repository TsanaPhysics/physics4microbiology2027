        <text y="64" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="700">มวล &bull; Mass</text>
      </g>
    
  <line x1="715.79" y1="347.92" x2="753.31" y2="317.99" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>
  <circle cx="715.79" cy="347.92" r="3.5" fill="#0284c7"/>

      <!-- Tape Measure -->
