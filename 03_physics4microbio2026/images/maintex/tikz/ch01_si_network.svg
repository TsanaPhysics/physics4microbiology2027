        <text y="64" text-anchor="middle" fill="#bae6fd" font-size="10" font-weight="700">ความยาว &bull; Length</text>
      </g>
    
  <line x1="769.08" y1="581.42" x2="815.88" y2="592.10" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>
  <circle cx="769.08" cy="581.42" r="3.5" fill="#22c55e"/>

      <!-- Stopwatch / Clock -->
