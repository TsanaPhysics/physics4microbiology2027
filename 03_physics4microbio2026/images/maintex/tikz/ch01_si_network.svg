  </g>
  <g transform="rotate(51.42857142857143, 500, 520) translate(500, 370)">
    <text transform="rotate(0)" text-anchor="middle" dominant-baseline="central" fill="#0369a1" font-size="13" font-weight="800" font-family="'Outfit','Prompt',sans-serif">meter</text>
  </g>
  <g transform="rotate(102.85714285714286, 500, 520) translate(500, 292)">
    <text transform="rotate(180)" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="28" font-weight="900" font-family="'Outfit','Prompt',sans-serif" filter="url(#cardShadow)">s</text>
  </g>
  <g transform="rotate(102.85714285714286, 500, 520) translate(500, 370)">
    <text transform="rotate(180)" text-anchor="middle" dominant-baseline="central" fill="#15803d" font-size="13" font-weight="800" font-family="'Outfit','Prompt',sans-serif">second</text>
  </g>
  <g transform="rotate(154.28571428571428, 500, 520) translate(500, 292)">
    <text transform="rotate(180)" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="28" font-weight="900" font-family="'Outfit','Prompt',sans-serif" filter="url(#cardShadow)">A</text>
  </g>
  <g transform="rotate(154.28571428571428, 500, 520) translate(500, 370)">
    <text transform="rotate(180)" text-anchor="middle" dominant-baseline="central" fill="#854d0e" font-size="13" font-weight="800" font-family="'Outfit','Prompt',sans-serif">ampere</text>
  </g>
  <g transform="rotate(205.71428571428572, 500, 520) translate(500, 292)">
    <text transform="rotate(180)" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="28" font-weight="900" font-family="'Outfit','Prompt',sans-serif" filter="url(#cardShadow)">K</text>
  </g>
  <g transform="rotate(205.71428571428572, 500, 520) translate(500, 370)">
