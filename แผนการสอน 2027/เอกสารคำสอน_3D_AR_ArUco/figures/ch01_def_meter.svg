<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%" style="background:#090d16; font-family:'Prompt',system-ui,sans-serif;">
  <defs>
    <linearGradient id="meterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glowDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="920" height="460" fill="#090d16"/>

  <!-- Title -->
  <text x="460" y="38" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">วิวัฒนาการนิยาม "ความยาว 1 เมตร (1 Metre)" ตั้งแต่อดีตสู่ปัจจุบัน</text>
  <text x="460" y="60" text-anchor="middle" fill="#94a3b8" font-size="12">จากการวัดเส้นรอบวงโลก สู่แท่งโลหะต้นแบบ จนถึงความเร็วแสงในสุญญากาศที่แม่นยำระดับสัมบูรณ์</text>

  <!-- Timeline Horizontal Axis -->
  <line x1="80" y1="180" x2="840" y2="180" stroke="#334155" stroke-width="4"/>
  <circle cx="130" cy="180" r="10" fill="#38bdf8"/>
  <circle cx="360" cy="180" r="10" fill="#60a5fa"/>
  <circle cx="590" cy="180" r="10" fill="#a855f7"/>
  <circle cx="810" cy="180" r="12" fill="#34d399" stroke="#059669" stroke-width="3"/>

  <!-- Stage 1: 1791 (French Revolution / Earth Meridian) -->
  <g transform="translate(130, 0)" filter="url(#glowDrop)">
    <!-- Year Tag -->
    <rect x="-45" y="115" width="90" height="26" rx="13" fill="#0284c7"/>
    <text y="132" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700" font-family="'JetBrains Mono',monospace">ค.ศ. 1791</text>
    
    <!-- Info Card -->
    <rect x="-85" y="215" width="170" height="210" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text y="240" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">1. เส้นเมอริเดียนโลก</text>
    <text y="258" text-anchor="middle" fill="#64748b" font-size="10" font-family="'JetBrains Mono',monospace">(Earth Meridian)</text>

    <!-- Visual Icon -->
    <g transform="translate(0, 300)">
      <circle r="26" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <ellipse rx="26" ry="10" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,2"/>
      <line x1="0" y1="-26" x2="0" y2="26" stroke="#fbbf24" stroke-width="1.5"/>
      <path d="M 0 -26 A 26 26 0 0 1 26 0" fill="none" stroke="#ef4444" stroke-width="3"/>
    </g>

    <text y="350" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="500">1 ใน 10,000,000</text>
    <text y="368" text-anchor="middle" fill="#94a3b8" font-size="10">ของระยะทางจาก</text>
    <text y="384" text-anchor="middle" fill="#94a3b8" font-size="10">ขั้วโลกเหนือถึงเส้นศูนย์สูตร</text>
    <text y="402" text-anchor="middle" fill="#64748b" font-size="9">(ผ่านกรุงปารีส)</text>
  </g>

  <!-- Stage 2: 1889 (Prototype Metre Bar Pt-Ir) -->
  <g transform="translate(360, 0)" filter="url(#glowDrop)">
    <!-- Year Tag -->
    <rect x="-45" y="115" width="90" height="26" rx="13" fill="#2563eb"/>
    <text y="132" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700" font-family="'JetBrains Mono',monospace">ค.ศ. 1889</text>

    <!-- Info Card -->
    <rect x="-85" y="215" width="170" height="210" rx="14" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
    <text y="240" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="700">2. แท่งเมตรมาตรฐาน</text>
    <text y="258" text-anchor="middle" fill="#64748b" font-size="10" font-family="'JetBrains Mono',monospace">(Standard Metre Bar)</text>

    <!-- Visual Icon -->
    <g transform="translate(0, 300)">
      <rect x="-40" y="-8" width="80" height="16" rx="3" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
      <line x1="-30" y1="-8" x2="-30" y2="8" stroke="#fbbf24" stroke-width="2"/>
      <line x1="30" y1="-8" x2="30" y2="8" stroke="#fbbf24" stroke-width="2"/>
      <!-- X-cross section shape symbol -->
      <path d="M -5 -6 L 5 6 M -5 6 L 5 -6" stroke="#cbd5e1" stroke-width="1.5"/>
    </g>

    <text y="350" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="500">โลหะผสม Pt-Ir 90:10</text>
    <text y="368" text-anchor="middle" fill="#94a3b8" font-size="10">ระยะระหว่างรอยขีด 2 รอย</text>
    <text y="384" text-anchor="middle" fill="#94a3b8" font-size="10">บนแท่งหน้าตัดรูปกากบาท</text>
    <text y="402" text-anchor="middle" fill="#f87171" font-size="9">⚠️ เสี่ยงต่อการขยายตัวตาม T</text>
  </g>

  <!-- Stage 3: 1960 (Krypton-86 Wavelength) -->
  <g transform="translate(590, 0)" filter="url(#glowDrop)">
    <!-- Year Tag -->
    <rect x="-45" y="115" width="90" height="26" rx="13" fill="#7c3aed"/>
    <text y="132" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700" font-family="'JetBrains Mono',monospace">ค.ศ. 1960</text>

    <!-- Info Card -->
    <rect x="-85" y="215" width="170" height="210" rx="14" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
    <text y="240" text-anchor="middle" fill="#c084fc" font-size="13" font-weight="700">3. คลื่นแสงคริปทอน-86</text>
    <text y="258" text-anchor="middle" fill="#64748b" font-size="10" font-family="'JetBrains Mono',monospace">(Krypton-86 Radiation)</text>

    <!-- Visual Icon -->
    <g transform="translate(0, 300)">
      <path d="M -40 0 Q -30 -14 -20 0 T 0 0 T 20 0 T 40 0" fill="none" stroke="#c084fc" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="3" fill="#fbbf24"/>
    </g>

    <text y="348" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="500">1,650,763.73 เท่า</text>
    <text y="366" text-anchor="middle" fill="#94a3b8" font-size="10">ของความยาวคลื่นแสง</text>
    <text y="382" text-anchor="middle" fill="#94a3b8" font-size="10">สีส้ม-แดงจากการเปลี่ยนระดับ</text>
    <text y="398" text-anchor="middle" fill="#94a3b8" font-size="10">พลังงานของอะตอม ⁸⁶Kr</text>
  </g>

  <!-- Stage 4: 1983 - Present (Speed of Light c in Vacuum) -->
  <g transform="translate(810, 0)" filter="url(#glowDrop)">
    <!-- Year Tag -->
    <rect x="-55" y="115" width="110" height="26" rx="13" fill="#059669"/>
    <text y="132" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700" font-family="'JetBrains Mono',monospace">1983–ปัจจุบัน</text>

    <!-- Info Card (Gold/Emerald High Importance) -->
    <rect x="-95" y="215" width="190" height="210" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="2.5"/>
    <text y="240" text-anchor="middle" fill="#34d399" font-size="13" font-weight="800">4. อัตราเร็วแสง c</text>
    <text y="258" text-anchor="middle" fill="#a7f3d0" font-size="10" font-family="'JetBrains Mono',monospace">c = 299,792,458 m/s</text>

    <!-- Visual Icon (Laser Light Beam) -->
    <g transform="translate(0, 300)">
      <line x1="-50" y1="0" x2="50" y2="0" stroke="#34d399" stroke-width="3"/>
      <circle cx="50" cy="0" r="5" fill="#facc15"/>
      <polygon points="50,0 40,-5 40,5" fill="#facc15"/>
      <text y="-8" text-anchor="middle" fill="#facc15" font-size="9" font-family="'JetBrains Mono',monospace">1 / 299,792,458 s</text>
    </g>

    <text y="348" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">ระยะทางที่แสงเดินทาง</text>
    <text y="366" text-anchor="middle" fill="#a7f3d0" font-size="10">ในสุญญากาศในเวลา</text>
    <text y="384" text-anchor="middle" fill="#fef08a" font-size="11" font-weight="700" font-family="'JetBrains Mono',monospace">1 / 299 792 458 วินาที</text>
    <text y="402" text-anchor="middle" fill="#6ee7b7" font-size="9">✓ ความคลาดเคลื่อน = 0 (คงที่แท้จริง)</text>
  </g>
</svg>
